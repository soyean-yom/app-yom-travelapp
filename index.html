<meta name="apple-mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:'DungGeunMo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');font-weight:normal;font-style:normal;font-display:swap;}
.pixel-title{font-family:'DungGeunMo', -apple-system, sans-serif;letter-spacing:0.5px;}
:root{--bg:#EFEEF2;--card:#fff;--ink:#17171A;--sub:#8B8B92;--field:#F4F4F6;--grad:linear-gradient(135deg,#6C96FF 0%,#C77DFF 100%);--gs:rgba(108,150,255,.35);--success:#34C77B;--warn:#FF9457;--gold:#FFC93C;--danger:#D9502E;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#DEDDE2;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font-family:inherit;}
#root{max-width:448px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pad{padding:16px;}
.card{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 6px 20px rgba(23,23,26,.06);}
.row{display:flex;align-items:center;gap:12px;}
.glow{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pill{border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;background:var(--field);color:#5B5B62;flex-shrink:0;cursor:pointer;}
.pill.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px var(--gs);}
.linkpill{display:inline-flex;align-items:center;gap:4px;border:none;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;background:var(--field);color:#4A4A55;cursor:pointer;}
.primary-btn{width:100%;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:700;color:#fff;background:var(--grad);display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 18px var(--gs);cursor:pointer;}
.primary-btn:disabled{background:#D8D8DC;box-shadow:none;color:#fff;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;border:1px solid transparent;border-radius:14px;padding:11px 14px;font-size:14px;color:var(--ink);background:var(--field);}
.field textarea{min-height:56px;resize:vertical;}
.two-col{display:flex;gap:10px;}
.two-col .field{flex:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,26,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{width:100%;max-width:448px;background:#fff;border-radius:28px 28px 0 0;padding:20px;max-height:86vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.modal-header h2{font-size:18px;font-weight:800;color:var(--ink);margin:0;}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--field);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.section-title{font-size:12px;font-weight:800;color:var(--sub);margin:6px 0 8px;letter-spacing:.3px;}
.empty-hint{text-align:center;padding:36px 0;color:#B4B4BB;font-size:12px;}
.empty-hint .ico{font-size:26px;margin-bottom:6px;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;}
.chip-row::-webkit-scrollbar{display:none;}
.dashed{border-top:2px dashed #E4E4E8;margin-top:12px;padding-top:12px;}
.tabbar{display:flex;background:#fff;box-shadow:0 -6px 20px rgba(23,23,26,.06);padding:8px 6px 0;flex-shrink:0;}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:10px;border:none;background:none;cursor:pointer;}
.tabbtn .label{font-size:10px;font-weight:600;color:#C2C2C8;}
.tabbtn.active .label{font-weight:800;color:var(--ink);}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.chipgroup{display:flex;gap:8px;}
.chip-opt{flex:1;padding:10px;border-radius:16px;border:none;font-size:13px;font-weight:700;background:var(--field);color:#6B6B72;cursor:pointer;}
.chip-opt.active{color:#fff;}
.header-btn{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(23,23,26,.08);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.rate-btn{display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:999px;background:#fff;box-shadow:0 4px 12px rgba(23,23,26,.08);border:none;cursor:pointer;flex-shrink:0;}
.mono{font-family:'SF Mono',ui-monospace,Menlo,monospace;}
.ticket-hole{position:relative;height:1px;margin:0 16px;}
.ticket-hole .line{position:absolute;left:0;right:0;border-top:2px dashed #E4E4E8;}
.ticket-hole .hole{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bg);top:-9px;}
.checkbtn{border:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--field);cursor:pointer;flex-shrink:0;}
.deco-strip{height:7px;background:repeating-linear-gradient(45deg,#FFD3E6,#FFD3E6 6px,#FFF7FA 6px,#FFF7FA 12px);flex-shrink:0;}
.washi{position:absolute;top:-6px;left:16px;width:44px;height:16px;border-radius:2px;opacity:.85;transform:rotate(-4deg);box-shadow:0 2px 4px rgba(0,0,0,.08);}
.sticker-row{display:flex;gap:6px;align-items:center;}
.sticker-row span{font-size:15px;}
.sparkle{position:relative;}

</style>

<script>
/* ---------------- safety net: show errors on screen instead of a blank page ---------------- */
window.addEventListener('error', function(ev){
  var el = document.getElementById('root');
  if (el) el.innerHTML = '<div style="padding:24px;color:#900;font-family:sans-serif;font-size:13px;white-space:pre-wrap;">문제가 발생했어요:\n' + (ev.message || String(ev.error||'')) + '</div>';
});
window.addEventListener('unhandledrejection', function(ev){
  var el = document.getElementById('root');
  if (el) el.innerHTML = '<div style="padding:24px;color:#900;font-family:sans-serif;font-size:13px;white-space:pre-wrap;">문제가 발생했어요:\n' + String(ev.reason) + '</div>';
});

function grassStripSvg(color, teeth){
  teeth = teeth || 22;
  var w = 100/teeth, path = '';
  for (var i=0;i<teeth;i++){
    var x0=i*w, xm=x0+w/2, x1=x0+w;
    path += 'M'+x0.toFixed(2)+',10 L'+xm.toFixed(2)+',2 L'+x1.toFixed(2)+',10 Z ';
  }
  return '<svg viewBox="0 0 100 10" preserveAspectRatio="none" style="width:100%;height:12px;display:block;"><rect x="0" y="6" width="100" height="4" fill="'+color+'"/><path d="'+path+'" fill="'+color+'"/></svg>';
}
function pixelIcon(name, size, color, accent, bg){
  var def = FLAT_ICON_DEFS[name]; if (!def) return '';
  var inner = def(color, accent||color, bg||'#fff');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24">'+inner+'</svg>';
}

/* Uses the browser's own localStorage so the app works as a standalone hosted site
   (window.storage only exists inside the Claude artifact preview, not on a real URL). */
async function storeGet(key){ try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
async function storeSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

/* ---------------- photos + OCR (all client-side, nothing leaves the browser except the OCR library itself) ---------------- */
function resizeImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var maxDim = 860, w = img.width, h = img.height;
        if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = function(){ reject(new Error('이미지를 불러오지 못했어요')); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error('파일을 읽지 못했어요')); };
    reader.readAsDataURL(file);
  });
}
function photoKey(entityId){ return 'photos:'+entityId; }
async function loadPhotosFor(entityId){
  if (photoCache[entityId]) return photoCache[entityId];
  var arr = await storeGet(photoKey(entityId));
  photoCache[entityId] = arr || [];
  return photoCache[entityId];
}
async function savePhotosFor(entityId, arr){ photoCache[entityId] = arr; await storeSet(photoKey(entityId), arr); }

var tesseractLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = function(){ resolve(); };
    s.onerror = function(){ tesseractLoading = null; reject(new Error('OCR 라이브러리를 불러오지 못했어요')); };
    document.head.appendChild(s);
  });
  return tesseractLoading;
}
async function ocrPendingPhoto(photoId, btnEl){
  var photo = pendingPhotos.find(function(p){ return p.id===photoId; });
  if (!photo) return;
  var originalLabel = btnEl.textContent;
  try{
    btnEl.textContent = '인식 중…'; btnEl.disabled = true;
    await loadTesseract();
    var result = await window.Tesseract.recognize(photo.dataUrl, 'kor+eng+jpn');
    var text = ((result && result.data && result.data.text) || '').trim();
    var field = activeNoteFieldId ? document.getElementById(activeNoteFieldId) : null;
    if (field && text) field.value = (field.value ? field.value + '\n' : '') + text;
    btnEl.textContent = text ? '완료 ✓' : '텍스트 없음';
  } catch(err){
    btnEl.textContent = '인식 실패';
  } finally {
    setTimeout(function(){ btnEl.disabled=false; btnEl.textContent=originalLabel; }, 1200);
  }
}
function removePendingPhoto(photoId){
  pendingPhotos = pendingPhotos.filter(function(p){ return p.id!==photoId; });
  var c = document.getElementById('photo-thumbs');
  if (c) c.innerHTML = photoThumbsHtml();
}
function photoThumbsHtml(){
  return pendingPhotos.map(function(p){
    return '<div style="position:relative;display:inline-block;margin:0 8px 8px 0;vertical-align:top;">'+
      '<img src="'+p.dataUrl+'" onclick="openLightboxFromImg(this)" style="width:64px;height:64px;object-fit:cover;border-radius:12px;display:block;cursor:pointer;" />'+
      '<button type="button" onclick="removePendingPhoto(\''+p.id+'\')" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#D9502E;color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer;">×</button>'+
      '<button type="button" onclick="ocrPendingPhoto(\''+p.id+'\', this)" style="display:block;width:64px;margin-top:3px;font-size:9px;border:none;background:var(--field);border-radius:8px;padding:3px 0;cursor:pointer;color:#4A4A55;">OCR 텍스트 인식</button>'+
    '</div>';
  }).join('');
}
function photoPickerHtml(inputId){

async function openTrip(id){
  S.currentTripId = id; S.tab='budget';

async function saveTripData(next){ S.tripData = next; await storeSet('trip:'+S.currentTripId, next); render(); }
async function createTrip(form){
  var trip = { id:uid(), name:form.name, country:form.country||'', flag:form.flag||'', destination:form.destination||'', currency:form.currency, rate:parseFloat(form.rate)||1, createdAt:Date.now(), areas:[], startDate:form.startDate||'', endDate:form.endDate||'', customIcon:form.customIcon||'' };
  await saveTrips([trip].concat(S.trips));
  S.ui.showNewTrip=false;
  await openTrip(trip.id);
}
async function deleteTrip(id){ var next = S.trips.filter(function(t){return t.id!==id;}); S.ui.confirmDeleteTripId=null; await saveTrips(next); render(); }

/* ---------------- small ui builders ---------------- */
function catGlow(meta, size){
  var content;
  if (meta && meta.image && IMG_ICONS[meta.image]) {
    var isz = Math.round(size*0.68);
    content = '<img src="'+IMG_ICONS[meta.image]+'" style="width:'+isz+'px;height:'+isz+'px;object-fit:contain;" />';
  } else if (meta && meta.pixel && FLAT_ICON_DEFS[meta.pixel]) {
    content = pixelIcon(meta.pixel, Math.round(size*0.55), '#17171A', meta.color);
  } else {
    content = (meta&&meta.icon)||'📍';
  }
  return glow(content, (meta&&meta.color)||'#B8B8BC', size);
}
function glow(emoji, color, size){
  size = size||38;
  return '<div class="glow" style="width:'+size+'px;height:'+size+'px;background:'+color+'3D;box-shadow:0 0 16px 4px '+color+'40;font-size:'+Math.round(size*0.5)+'px;">'+emoji+'</div>';
}
function pill(label, active, act, data){
  return '<button class="pill'+(active?' active':'')+'" data-act="'+act+'"'+(data||'')+'>'+label+'</button>';
}
function linkpill(label, iconName, act, data, danger){
  return '<button class="linkpill" data-act="'+act+'"'+(data||'')+' style="'+(danger?'color:#D9502E':'')+'">'+ico(iconName,12,danger?'#D9502E':'#4A4A55')+label+'</button>';
}
function emptyHint(text, emoji){
  return '<div class="empty-hint"><div class="ico">'+(emoji||'📁')+'</div><p>'+esc(text)+'</p></div>';
}
function modalWrap(title, inner){

}

/* ---------------- render root ---------------- */
function render(){
  var root = document.getElementById('root');
  var prevScroll = root.querySelector('.scroll');
  var savedScrollTop = prevScroll ? prevScroll.scrollTop : 0;
  if (!S.ready){ root.innerHTML = '<div style="height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;">'+ico('loader',26,'#17171A')+'</div>'; addSpin(); return; }
  if (S.showSettings){ root.innerHTML = settingsScreen(); }
  else if (!S.currentTripId || !currentTrip()){ root.innerHTML = homeScreen(); }
  else if (!S.tripData){ root.innerHTML = '<div style="height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;">'+ico('loader',26,'#17171A')+'</div>'; addSpin(); return; }
  else { root.innerHTML = tripScreen(); }
  var newScroll = root.querySelector('.scroll');
  if (newScroll && savedScrollTop) newScroll.scrollTop = savedScrollTop;
}
function addSpin(){ var svg = document.querySelector('svg'); if (svg) svg.classList.add('spin'); }

/* ---------------- budget tab ---------------- */
function entryKrw(item, trip){
  if (item.payMode==='krw') return Math.round(item.amount);
  return Math.round(item.amount * (item.rate || trip.rate));
}
function currencyBreakdown(items, trip){
  var byCur = {}, krwDirect = 0;
  items.forEach(function(i){
    if (i.payMode==='krw'){ krwDirect += i.amount; }
    else { var cur = i.currency || trip.currency; byCur[cur] = (byCur[cur]||0) + i.amount; }
  });
  return { byCur: byCur, krwDirect: krwDirect };
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatMD(dateStr){ if (!dateStr) return ''; var p=dateStr.split('-'); return parseInt(p[1],10)+'/'+parseInt(p[2],10); }
function formatDateRange(start, end){
  if (start && end) return formatMD(start)+' - '+formatMD(end);
  if (start) return formatMD(start)+'~';
  return '';
}
function addDaysToDate(dateStr, n){
  var d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function progressBar(pct, color, height){
  return '<div style="height:'+(height||10)+'px;border-radius:8px;background:var(--field);overflow:hidden;"><div style="height:100%;width:'+Math.max(0,Math.min(100,pct))+'%;background:'+color+';border-radius:8px;"></div></div>';
}
function budgetStateColor(pct){ return pct<70?'#34C77B':(pct<95?'#FFC93C':'#D9502E'); }

function budgetTab(t){
  var items = S.tripData.budget||[];
  var paid = items.filter(function(i){return i.status==='paid';});
  var pending = items.filter(function(i){return i.status==='pending';});
  var totalPaid = paid.reduce(function(s,i){return s+entryKrw(i,t);},0);
  var totalPending = pending.reduce(function(s,i){return s+entryKrw(i,t);},0);
  var totalSpent = totalPaid + totalPending;
  var totalBudget = t.totalBudget||0;
  var pct = totalBudget>0 ? Math.round(totalSpent/totalBudget*100) : 0;
  var barColor = budgetStateColor(pct);
  var remaining = totalBudget - totalSpent;

  var bd = currencyBreakdown(items, t);
  var bdParts = Object.keys(bd.byCur).map(function(cur){ return cur+' '+bd.byCur[cur].toLocaleString(); });
  if (bd.krwDirect) bdParts.push('KRW(직접결제) '+bd.krwDirect.toLocaleString());

  var byDate = {};
  items.forEach(function(i){ var d=i.date||'날짜 미정'; byDate[d]=(byDate[d]||0)+entryKrw(i,t); });
  var dateKeys = Object.keys(byDate).sort();
  var maxDay = Math.max.apply(null, dateKeys.map(function(k){return byDate[k];}).concat([1]));
  var today = todayStr();
  var todaySpent = byDate[today]||0;
  var dailyRemaining = (t.dailyBudget||0) - todaySpent;

  var catBudgets = t.categoryBudgets||{};
  var catKeysWithBudget = Object.keys(catBudgets).filter(function(k){return catBudgets[k]>0;});
  function catSpent(key){ return items.filter(function(i){return i.category===key;}).reduce(function(s,i){return s+entryKrw(i,t);},0); }

  var html = '<div class="pad">';

  html += '<div class="card" style="margin-bottom:12px;">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:'+(totalBudget?'8px':'0')+';">'+
      '<div class="row">'+glow('💰',barColor,32)+'<div><div style="font-size:11px;color:var(--sub);font-weight:700;">총예산</div><div class="mono" style="font-size:16px;font-weight:800;color:var(--ink);">'+(totalBudget?'₩'+totalBudget.toLocaleString():'설정 안 함')+'</div></div></div>'+
      pill(ico('gear',11)+' 예산 설정', false, 'budget-settings-open')+
    '</div>'+
    (totalBudget ? (
      progressBar(pct, barColor, 14)+
      '<div class="row" style="justify-content:space-between;font-size:11px;color:var(--sub);margin-top:6px;"><span>사용 ₩'+totalSpent.toLocaleString()+' ('+pct+'%)</span><span style="color:'+(remaining<0?'#D9502E':'var(--sub)')+';font-weight:'+(remaining<0?'800':'400')+';">'+(remaining>=0?'남음 ₩'+remaining.toLocaleString():'초과 ₩'+Math.abs(remaining).toLocaleString())+'</span></div>'
    ) : '<p style="font-size:12px;color:var(--sub);margin:6px 0 0;">예산 설정을 누르면 진행률과 카테고리별 예산을 관리할 수 있어요.</p>')+
    (t.dailyBudget ? (
      '<div class="dashed"><div class="row" style="justify-content:space-between;"><span style="font-size:12px;color:var(--sub);font-weight:700;">오늘 사용 가능</span><span class="mono" style="font-size:14px;font-weight:800;color:'+(dailyRemaining<0?'#D9502E':'#34C77B')+';">₩'+dailyRemaining.toLocaleString()+'</span></div><div style="font-size:10px;color:var(--sub);">데일리 예산 ₩'+t.dailyBudget.toLocaleString()+' 중 오늘 ₩'+todaySpent.toLocaleString()+' 사용</div></div>'
    ) : '')+
  '</div>';

  if (bdParts.length) html += '<div style="font-size:11px;color:var(--sub);margin-bottom:14px;">현지 통화별 합계: '+bdParts.map(esc).join(' · ')+'</div>';

  if (catKeysWithBudget.length){
    html += '<div class="section-title">카테고리별 예산</div>';
    html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">'+catKeysWithBudget.map(function(key){
      var meta = catMeta(key), budget = catBudgets[key], spent = catSpent(key);
      var p = budget>0 ? Math.round(spent/budget*100) : 0;
      var c = budgetStateColor(p);
      return '<div class="card">'+
        '<div class="row" style="justify-content:space-between;margin-bottom:6px;">'+
          '<div class="row">'+catGlow(meta, 26)+'<span style="font-size:13px;font-weight:700;color:var(--ink);">'+esc(key)+'</span></div>'+
          '<span class="mono" style="font-size:12px;color:var(--sub);">₩'+spent.toLocaleString()+' / ₩'+budget.toLocaleString()+'</span>'+
        '</div>'+
        progressBar(p, c, 8)+
      '</div>';
    }).join('')+'</div>';
  }

  if (dateKeys.length>1 || (dateKeys.length===1 && dateKeys[0]!=='날짜 미정')){
    html += '<div class="section-title">일자별 소비</div>';
    html += '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">'+dateKeys.map(function(d){
      var amt=byDate[d], w=Math.round(amt/maxDay*100);
      return '<div>'+
        '<div class="row" style="justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:3px;"><span style="font-weight:700;color:var(--ink);">'+esc(d)+'</span><span class="mono">₩'+amt.toLocaleString()+'</span></div>'+
        progressBar(w, '#6C96FF', 8)+
      '</div>';
    }).join('')+'</div>';
  }

  html += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">'+pill(ico('plus',13,'#fff')+' 항목 추가', true, 'budget-add-open')+'</div>'+
    '<div class="section-title">결제 예정 ('+pending.length+')</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">'+(pending.length?pending.map(function(i){return budgetRow(i,entryKrw(i,t),t);}).join(''):emptyHint('예정된 결제가 없어요'))+'</div>'+
    '<div class="section-title">결제 완료 ('+paid.length+')</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+(paid.length?paid.map(function(i){return budgetRow(i,entryKrw(i,t),t);}).join(''):emptyHint('결제 완료 내역이 없어요'))+'</div>'+
  '</div>';
  if (S.ui.budget.showModal) html += budgetModal(t);
  if (S.ui.budget.showSettings) html += budgetSettingsModal(t);
  return html;
}
function budgetRow(item, krw, trip){
  var open = S.ui.budget.openId===item.id;

  var sub = item.payMode==='krw'

    '</div>'+
    (open ? '<div class="dashed" style="display:flex;justify-content:flex-end;gap:8px;">'+

function openLightboxFromImg(imgEl){
  var ov = document.getElementById('lightbox-overlay');
  if (!ov){ ov = document.createElement('div'); ov.id='lightbox-overlay'; document.body.appendChild(ov); }
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,10,14,.88);z-index:999;display:flex;align-items:center;justify-content:center;';
  ov.innerHTML = '<img src="'+imgEl.src+'" style="max-width:92vw;max-height:92vh;border-radius:14px;object-fit:contain;" />';

function savedPhotosHtml(entityId, photoCount){

  if (!arr.length) return '';
  return '<div style="margin-bottom:8px;">'+arr.map(function(p){
    return '<img src="'+p.dataUrl+'" onclick="openLightboxFromImg(this)" style="width:64px;height:64px;object-fit:cover;border-radius:12px;margin:0 8px 8px 0;cursor:pointer;display:inline-block;" />';

var TRANSIT_MODES = [
  { key:'도보', icon:'🚶', pixel:'walk' }, { key:'버스', icon:'🚌', pixel:'bus' }, { key:'지하철', icon:'🚇', pixel:'subway' },
  { key:'택시', icon:'🚕', pixel:'taxi' }, { key:'기차', icon:'🚆', pixel:'train' }, { key:'자전거', icon:'🚲', pixel:'bike' }, { key:'배', icon:'⛴️', pixel:'boat' },
];
var LINE_COLOR = '#6C96FF';
function itineraryTab(t){
  var days = S.tripData.itinerary||[];
  if (days.length===0){
    var html = '<div class="pad">'+emptyHint('아직 일정이 없어요', '🗺️✨')+'<button class="primary-btn" data-act="day-add">'+ico('plus',16,'#fff')+' 첫째 날 만들기</button></div>';
    return html;
  }
  function dayLabel(i){ return 'Day '+(i+1) + (t.startDate ? ' ('+formatMD(addDaysToDate(t.startDate,i))+')' : ''); }
  var idx = Math.min(S.ui.itinerary.activeDay, days.length-1);
  var day = days[idx];
  var html = '<div class="pad">';
  html += '<div class="chip-row">'+days.map(function(d,i){ return pill(dayLabel(i), i===idx, 'day-set', 'data-idx="'+i+'"'); }).join('')+pill(ico('plus',12,'#5B5B62')+' 날짜 추가', false, 'day-add')+'</div>';
  html += '<div class="row" style="justify-content:space-between;margin-bottom:12px;">'+
    '<div style="font-size:16px;font-weight:800;color:var(--ink);">'+dayLabel(idx)+'</div>'+
    '<div class="row">'+pill(ico('plus',13,'#fff')+' 일정 추가', true, 'item-add-open')+

    '</div></div>';

    var rows = '';
    day.items.forEach(function(item,i){
      rows += itineraryStopRow(item, i===day.items.length-1);

  } else {
    html += emptyHint('이 날의 일정을 추가해보세요', '🗺️✨');

  if (S.ui.itinerary.showModal) html += itineraryModal();
  if (S.ui.itinerary.transitEditId) html += transitModal();

function transitModal(){
  var days = S.tripData.itinerary||[];
  var day = days[S.ui.itinerary.activeDay];
  var toIdx = day.items.findIndex(function(i){return i.id===S.ui.itinerary.transitEditId;});
  var toItem = day.items[toIdx];
  if (!toItem) return '';
  var trip = currentTrip();
  var prevItem = toIdx>0 ? day.items[toIdx-1] : null;
  var t = toItem.transit || {};
  var costMode = t.costMode || 'local';
  var costCurrency = t.currency || (trip?trip.currency:'JPY');
  var inner = ''+
    (prevItem ? '<div style="margin-bottom:12px;">'+linkpill('구글맵에서 실제 경로·소요시간 보기','nav','gmaps-dir','data-origin="'+esc(prevItem.title)+'" data-dest="'+esc(toItem.title)+'"')+'</div>' : '')+
    '<div class="field"><label>이동수단</label><div class="chipgroup" style="flex-wrap:wrap;"><input type="hidden" id="tr-mode" value="'+(t.mode||'도보')+'">'+
      TRANSIT_MODES.map(function(m){ var mIcon = (m.image&&IMG_ICONS[m.image]) ? '<img src="'+IMG_ICONS[m.image]+'" style="width:15px;height:15px;object-fit:contain;" />' : pixelIcon(m.pixel,13,t.mode===m.key?'#fff':'#4A4A55'); return '<button type="button" class="chip-opt'+(t.mode===m.key?' active':'')+'" style="'+(t.mode===m.key?'background:'+LINE_COLOR:'')+'flex:0 0 auto;padding:8px 12px;display:inline-flex;align-items:center;gap:4px;" data-act="chip" data-target="tr-mode" data-value="'+m.key+'" data-active-bg="'+LINE_COLOR+'">'+mIcon+m.key+'</button>'; }).join('')+
    '</div></div>'+
    '<div class="field"><label>소요시간 (분)</label><input id="tr-duration" type="number" placeholder="예: 15" value="'+(t.duration||'')+'"></div>'+
    '<div class="field"><label>비용 (선택)</label><div class="chipgroup" style="margin-bottom:8px;"><input type="hidden" id="tr-costmode" value="'+costMode+'">'+
      '<button type="button" class="chip-opt'+(costMode==='local'?' active':'')+'" style="'+(costMode==='local'?'background:'+LINE_COLOR:'')+'" data-act="transit-costmode" data-value="local" data-active-bg="'+LINE_COLOR+'">현지통화</button>'+
      '<button type="button" class="chip-opt'+(costMode==='krw'?' active':'')+'" style="'+(costMode==='krw'?'background:'+LINE_COLOR:'')+'" data-act="transit-costmode" data-value="krw" data-active-bg="'+LINE_COLOR+'">원화(KRW)</button>'+
    '</div>'+
    '<div id="tr-local-wrap" class="two-col" style="display:'+(costMode==='local'?'flex':'none')+';">'+
      '<div class="field"><label>통화</label><select id="tr-currency">'+CURRENCIES.filter(function(c){return c!=='KRW';}).map(function(c){return '<option value="'+c+'"'+(costCurrency===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
      '<div class="field"><label>금액</label><input id="tr-cost-local" type="number" placeholder="예: 320" value="'+(costMode==='local'&&t.cost?t.cost:'')+'"></div>'+
    '</div>'+
    '<div id="tr-krw-wrap" style="display:'+(costMode==='krw'?'block':'none')+';"><div class="field"><label>금액 (KRW)</label><input id="tr-cost-krw" type="number" placeholder="예: 3000" value="'+(costMode==='krw'&&t.cost?t.cost:'')+'"></div></div>'+
    '</div>'+
    '<button class="primary-btn" data-act="transit-save" style="margin-bottom:8px;">저장</button>'+
    (toItem.transit ? '<button class="linkpill" data-act="transit-clear" style="width:100%;justify-content:center;padding:10px;">이동 정보 삭제</button>' : '');
  return modalWrap(esc(toItem.title)+' 가는 길', inner);
}

/* ---------------- archive tab ---------------- */
function archiveTab(){
  var items = (S.tripData.archive||[]).slice().sort(function(a,b){ return (a.date||'').localeCompare(b.date||''); });
  var html = '<div class="pad">';
  html += '<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">'+pill(ico('plus',13,'#fff')+' 예약 추가', true, 'archive-add-open')+'</div>';
  html += '<div style="display:flex;flex-direction:column;gap:12px;">'+(items.length?items.map(archiveTicket).join(''):emptyHint('항공·버스·호텔 예약 정보를 티켓처럼 모아둘 수 있어요', EMOJI.ticket))+'</div>';
  html += '</div>';
  if (S.ui.archive.showModal) html += archiveModal();
  return html;
}
function archiveTicket(item){
  var meta = archiveMeta(item.type);
  var open = S.ui.archive.openId===item.id;
  return '<div class="card" style="padding:0;overflow:hidden;">'+
    '<div class="row" style="padding:16px;cursor:pointer;" data-act="archive-toggle-open" data-id="'+item.id+'">'+
      catGlow(meta, 42)+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-size:12px;font-weight:800;color:'+meta.color+';">'+esc(item.type)+' · '+esc(item.provider||'미입력')+'</div>'+
        '<div style="font-size:15px;font-weight:800;color:var(--ink);">'+esc(item.title)+'</div>'+
        '<div style="font-size:12px;color:var(--sub);">'+esc(item.date||'날짜 미정')+' '+esc(item.time||'')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="ticket-hole"><div class="line"></div><div class="hole" style="left:-10px;"></div><div class="hole" style="right:-10px;"></div></div>'+
    '<div style="padding:14px 16px;display:flex;gap:20px;">'+
      '<div><div style="font-size:10px;color:var(--sub);font-weight:700;">예약번호</div><div class="mono" style="font-size:12px;font-weight:700;color:var(--ink);">'+esc(item.code||'-')+'</div></div>'+
      '<div><div style="font-size:10px;color:var(--sub);font-weight:700;">좌석/객실</div><div class="mono" style="font-size:12px;font-weight:700;color:var(--ink);">'+esc(item.seat||'-')+'</div></div>'+
    '</div>'+
    (open ? '<div style="padding:0 16px 16px;">'+
      savedPhotosHtml(item.id, item.photoCount)+
      (item.note?'<div style="font-size:12px;color:#6B6B72;background:var(--field);border-radius:12px;padding:10px;margin-bottom:10px;">'+esc(item.note)+'</div>':'')+
      '<div style="display:flex;justify-content:flex-end;gap:8px;">'+linkpill('수정','edit','archive-edit','data-id="'+item.id+'"')+linkpill('삭제','trash','archive-delete','data-id="'+item.id+'"',true)+'</div>'+
    '</div>' : '')+
  '</div>';
}
function archiveModal(){
  var e = S.ui.archive.editId ? (S.tripData.archive||[]).find(function(i){return i.id===S.ui.archive.editId;}) : null;
  var type = e ? e.type : '항공';
  var inner = ''+
    '<div class="field"><label>종류</label><div class="chipgroup"><input type="hidden" id="a-type" value="'+type+'">'+
      ARCHIVE_TYPES.map(function(t){return '<button type="button" class="chip-opt'+(type===t.key?' active':'')+'" style="'+(type===t.key?'background:'+t.color:'')+'" data-act="chip" data-target="a-type" data-value="'+t.key+'" data-active-bg="'+t.color+'">'+t.key+'</button>';}).join('')+
    '</div></div>'+
    '<div class="field"><label>제목</label><input id="a-title" placeholder="예: 인천 → 나리타 KE001" value="'+(e?esc(e.title):'')+'"></div>'+
    '<div class="field"><label>항공사/버스회사/호텔명 (선택)</label><input id="a-provider" value="'+(e&&e.provider?esc(e.provider):'')+'"></div>'+
    '<div class="two-col"><div class="field"><label>날짜</label><input id="a-date" type="date" value="'+(e?e.date:'')+'"></div><div class="field"><label>시간</label><input id="a-time" type="time" value="'+(e?e.time:'')+'"></div></div>'+
    '<div class="two-col"><div class="field"><label>예약번호 (선택)</label><input id="a-code" value="'+(e&&e.code?esc(e.code):'')+'"></div><div class="field"><label>좌석/객실 (선택)</label><input id="a-seat" value="'+(e&&e.seat?esc(e.seat):'')+'"></div></div>'+
    '<div class="field"><label>메모 (선택)</label><textarea id="a-note">'+(e&&e.note?esc(e.note):'')+'</textarea></div>'+
    photoPickerHtml('a-photo-input')+
    '<button class="primary-btn" data-act="archive-save">저장</button>';
  return modalWrap(e?'예약 수정':'예약 추가', inner);
}

/* ---------------- event dispatch ---------------- */
document.getElementById('root').addEventListener('click', async function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act, id = el.dataset.id;

  if (act==='overlay-close'){ if (e.target!==el) return; closeAllModals(); render(); return; }
  if (act==='close-modal'){ closeAllModals(); render(); return; }
  if (act==='chip'){
    var group = el.parentElement;
    group.querySelectorAll('.chip-opt').forEach(function(b){ b.classList.remove('active'); b.style.background=''; });
    el.classList.add('active'); el.style.background = el.dataset.activeBg || '#17171A';
    var target = document.getElementById(el.dataset.target); if (target) target.value = el.dataset.value;
    return;
  }
  if (act==='place-heart-pick'){
    var hVal = parseInt(el.dataset.value,10);
    var hidden = document.getElementById('place-hearts');
    var cur = parseInt(hidden.value,10)||0;
    var newVal = (cur===hVal) ? 0 : hVal;
    hidden.value = newVal;
    var grp = document.getElementById('heart-picker');
    grp.querySelectorAll('[data-act="place-heart-pick"]').forEach(function(b,i){ b.textContent = (i<newVal) ? '❤️' : '🤍'; });
    return;
  }
  if (act==='transit-costmode'){
    var g3 = el.parentElement;
    g3.querySelectorAll('.chip-opt').forEach(function(b){ b.classList.remove('active'); b.style.background=''; });
    el.classList.add('active'); el.style.background = el.dataset.activeBg||LINE_COLOR;
    document.getElementById('tr-costmode').value = el.dataset.value;
    var lw=document.getElementById('tr-local-wrap'), kw=document.getElementById('tr-krw-wrap');
    if (lw) lw.style.display = el.dataset.value==='local' ? 'flex' : 'none';
    if (kw) kw.style.display = el.dataset.value==='krw' ? 'block' : 'none';
    return;
  }
  if (act==='budget-paymode'){
    var group2 = el.parentElement;
    group2.querySelectorAll('.chip-opt').forEach(function(b){ b.classList.remove('active'); b.style.background=''; });
    el.classList.add('active'); el.style.background = el.dataset.activeBg || '#17171A';
    document.getElementById('b-paymode').value = el.dataset.value;
    var localWrap=document.getElementById('b-local-wrap'), krwWrap=document.getElementById('b-krw-wrap');
    if (localWrap) localWrap.style.display = el.dataset.value==='local' ? 'block' : 'none';
    if (krwWrap) krwWrap.style.display = el.dataset.value==='krw' ? 'block' : 'none';
    return;
  }

  /* home */
  if (act==='new-trip'){ S.ui.showNewTrip=true; render(); return; }
  if (act==='open-trip'){ await openTrip(id); return; }
  if (act==='confirm-del-trip'){ S.ui.confirmDeleteTripId=id; render(); return; }
  if (act==='cancel-del-trip'){ S.ui.confirmDeleteTripId=null; render(); return; }
  if (act==='delete-trip'){ await deleteTrip(id); return; }
  if (act==='nt-country-pick'){
    document.querySelectorAll('#nt-country-grid button').forEach(function(b){ b.style.background='var(--field)'; b.style.boxShadow=''; });
    el.style.background='#FFE8F0'; el.style.boxShadow='0 0 0 2px #FF7AA2 inset';
    document.getElementById('nt-country').value = el.dataset.country;
    document.getElementById('nt-flag').value = el.dataset.flag;
    var curSel = document.getElementById('nt-currency');
    if (curSel) curSel.value = el.dataset.currency;
    return;
  }
  if (act==='create-trip'){
    var name=document.getElementById('nt-name').value.trim() || '제목 없는 여행';
    var country=document.getElementById('nt-country').value, flag=document.getElementById('nt-flag').value;
    var dest=document.getElementById('nt-dest').value.trim();
    var currency=document.getElementById('nt-currency').value || 'JPY', rate=document.getElementById('nt-rate').value || '1';
    var startDate=document.getElementById('nt-start').value, endDate=document.getElementById('nt-end').value;
    var customIcon=document.getElementById('nt-icon').value.trim();
    await createTrip({ name:name, country:country, flag:flag, destination:dest, currency:currency, rate:rate, startDate:startDate, endDate:endDate, customIcon:customIcon });
    return;
  }

  /* settings */
  if (act==='open-settings'){ S.showSettings=true; render(); return; }
  if (act==='settings-nickname-save'){
    S.settings.nickname = document.getElementById('nickname-input').value.trim();
    await saveSettings(); render(); return;
  }
  if (act==='settings-maxhearts-save'){
    S.settings.maxHearts = parseInt(document.getElementById('maxhearts-input').value,10)||3;
    await saveSettings(); render(); return;
  }
  if (act==='close-settings'){ S.showSettings=false; render(); return; }
  if (act==='settings-cat-color'){
    var colorHidden = document.getElementById('new-cat-color-input');
    if (colorHidden) colorHidden.value = el.dataset.color;
    var colorRow = document.getElementById('new-cat-color-row');
    if (colorRow) colorRow.querySelectorAll('button').forEach(function(b){ b.style.border = b===el ? '3px solid #17171A' : '3px solid transparent'; });
    S.ui.settingsUi.newCatColor = el.dataset.color;
    return;
  }
  if (act==='settings-cat-add'){
    var newCatName=document.getElementById('new-cat-name').value.trim(); if (!newCatName) return;
    if (S.settings.categories.some(function(c){return c.key===newCatName;})) return;
    var newCatIcon=document.getElementById('new-cat-icon-input').value.trim() || '📍';
    var newCatColor=document.getElementById('new-cat-color-input').value || S.ui.settingsUi.newCatColor;
    S.settings.categories = S.settings.categories.concat([{ key:newCatName, color:newCatColor, icon:newCatIcon }]);
    await saveSettings(); render(); return;
  }
  if (act==='settings-cat-delete'){
    S.settings.categories = S.settings.categories.filter(function(c){return c.key!==el.dataset.key;});
    await saveSettings(); render(); return;
  }
  if (act==='settings-pm-add'){
    var newPm=document.getElementById('new-pm-name').value.trim(); if (!newPm) return;
    if (S.settings.paymentMethods.indexOf(newPm)===-1) S.settings.paymentMethods = S.settings.paymentMethods.concat([newPm]);
    await saveSettings(); render(); return;
  }
  if (act==='settings-pm-delete'){
    S.settings.paymentMethods = S.settings.paymentMethods.filter(function(p){return p!==el.dataset.name;});
    await saveSettings(); render(); return;
  }

  /* trip shell */
  if (act==='back'){ S.currentTripId=null; S.tripData=null; render(); return; }
  if (act==='set-tab'){ S.tab = el.dataset.tab; render(); return; }
  if (act==='open-trip-edit'){ S.ui.showRateEdit=true; render(); return; }
  if (act==='te-country-pick'){
    document.querySelectorAll('#te-country-grid button').forEach(function(b){ b.style.background='var(--field)'; b.style.boxShadow='none'; });
    el.style.background='#FFE8F0'; el.style.boxShadow='0 0 0 2px #FF7AA2 inset';
    document.getElementById('te-country').value = el.dataset.country;
    document.getElementById('te-flag').value = el.dataset.flag;
    var curSel2 = document.getElementById('te-currency');
    if (curSel2) curSel2.value = el.dataset.currency;
    return;
  }
  if (act==='save-trip-edit'){
    var teName = document.getElementById('te-name').value.trim() || '제목 없는 여행';
    var teCountry = document.getElementById('te-country').value, teFlag = document.getElementById('te-flag').value;
    var teDest = document.getElementById('te-dest').value.trim();
    var teStart = document.getElementById('te-start').value, teEnd = document.getElementById('te-end').value;
    var teCurrency = document.getElementById('te-currency').value;
    var teRate = parseFloat(document.getElementById('te-rate').value) || currentTrip().rate;
    var teIcon = document.getElementById('te-icon').value.trim();
    var next = S.trips.map(function(t){ return t.id===S.currentTripId ? Object.assign({},t,{ name:teName, country:teCountry, flag:teFlag, destination:teDest, startDate:teStart, endDate:teEnd, currency:teCurrency, rate:teRate, customIcon:teIcon }) : t; });
    S.ui.showRateEdit=false; await saveTrips(next); render(); return;
  }

  /* budget */
  if (act==='budget-add-open'){ S.ui.budget.editId=null; S.ui.budget.showSettings=false; S.ui.budget.showModal=true; render(); return; }
  if (act==='budget-edit'){ S.ui.budget.editId=id; S.ui.budget.showSettings=false; S.ui.budget.showModal=true; render(); return; }
  if (act==='budget-settings-open'){ S.ui.budget.showModal=false; S.ui.budget.showSettings=true; render(); return; }
  if (act==='budget-settings-save'){
    var trip5=currentTrip(); if (!trip5) return;
    var totalVal=document.getElementById('bs-total').value; var dailyVal=document.getElementById('bs-daily').value;
    var catBudgets2={};
    var catInputs=document.querySelectorAll('.bs-cat-input');
    catInputs.forEach(function(inp){ var v=parseFloat(inp.value); if (!isNaN(v) && v>0) catBudgets2[inp.dataset.cat]=v; });
    var updated=Object.assign({},trip5,{ totalBudget: totalVal?parseFloat(totalVal):0, dailyBudget: dailyVal?parseFloat(dailyVal):0, categoryBudgets: catBudgets2 });
    S.ui.budget.showSettings=false;
    await saveTrips(S.trips.map(function(t2){ return t2.id===trip5.id ? updated : t2; }));
    render(); return;
  }
  if (act==='budget-delete'){ var next=(S.tripData.budget||[]).filter(function(i){return i.id!==id;}); await saveTripData(Object.assign({},S.tripData,{budget:next})); return; }
  if (act==='budget-toggle-open'){ S.ui.budget.openId = S.ui.budget.openId===id?null:id; render(); return; }
  if (act==='budget-toggle-paid'){
    var items=(S.tripData.budget||[]).map(function(i){ return i.id===id ? Object.assign({},i,{status: i.status==='paid'?'pending':'paid'}) : i; });
    await saveTripData(Object.assign({},S.tripData,{budget:items})); return;
  }
  if (act==='budget-save'){
    var title=document.getElementById('b-title').value.trim(); if (!title) return;
    var status=document.getElementById('b-status').value;
    var payMode=document.getElementById('b-paymode').value;
    var paymentMethod=document.getElementById('b-paymethod').value;
    var category=document.getElementById('b-category').value;
    var dateField=document.getElementById('b-date').value;
    var entry;
    if (payMode==='krw'){
      var amountKrw=parseFloat(document.getElementById('b-amount-krw').value);
      if (isNaN(amountKrw)) return;
      entry={ title:title, status:status, payMode:'krw', amount:amountKrw, paymentMethod:paymentMethod, category:category, date:dateField };
    } else {
      var amountLocal=parseFloat(document.getElementById('b-amount-local').value);
      var currencyVal=document.getElementById('b-currency').value;
      var rateVal=parseFloat(document.getElementById('b-rate').value);
      if (isNaN(amountLocal) || isNaN(rateVal)) return;
      entry={ title:title, status:status, payMode:'local', currency:currencyVal, amount:amountLocal, rate:rateVal, paymentMethod:paymentMethod, category:category, date:dateField };
    }
    var list=S.tripData.budget||[]; var editId=S.ui.budget.editId;
    entry.id = editId||uid();
    var next = editId ? list.map(function(i){return i.id===editId?entry:i;}) : [entry].concat(list);
    S.ui.budget.showModal=false; S.ui.budget.editId=null;
    await saveTripData(Object.assign({},S.tripData,{budget:next})); return;
  }

  /* places */
  if (act==='places-view'){ S.ui.places.view=el.dataset.view; render(); return; }
  if (act==='places-cat-filter'){ S.ui.places.filterCat=el.dataset.cat; render(); return; }
  if (act==='places-area-filter'){ S.ui.places.filterArea=el.dataset.area; render(); return; }
  if (act==='area-manage-open'){ S.ui.places.priceModalFor=null; S.ui.places.showModal=false; S.ui.places.showAreaManage=true; render(); return; }
  if (act==='area-add'){
    var newArea=document.getElementById('new-area-name').value.trim(); if (!newArea) return;
    var trip2=currentTrip(); if (!trip2) return;
    if ((trip2.areas||[]).indexOf(newArea)===-1){
      await saveTrips(S.trips.map(function(t){ return t.id===trip2.id ? Object.assign({},t,{areas:(t.areas||[]).concat([newArea])}) : t; }));
    }
    render(); return;
  }
  if (act==='area-delete'){
    var trip3=currentTrip(); if (!trip3) return;
    await saveTrips(S.trips.map(function(t){ return t.id===trip3.id ? Object.assign({},t,{areas:(t.areas||[]).filter(function(a){return a!==el.dataset.area;})}) : t; }));
    if (S.ui.places.filterArea===el.dataset.area) S.ui.places.filterArea='전체';
    render(); return;
  }
  if (act==='places-rating-toggle'){ S.ui.places.ratingOnly=!S.ui.places.ratingOnly; render(); return; }
  if (act==='places-add-open'){ await openEntityForm('place', null, 0); S.ui.places.editId=null; S.ui.places.priceModalFor=null; S.ui.places.showAreaManage=false; S.ui.places.showModal=true; render(); return; }
  if (act==='places-edit'){
    var pEntity=(S.tripData.places||[]).find(function(p){return p.id===id;});
    await openEntityForm('place', id, pEntity && pEntity.photoCount);
    S.ui.places.editId=id; S.ui.places.priceModalFor=null; S.ui.places.showAreaManage=false; S.ui.places.showModal=true; render(); return;
  }
  if (act==='places-delete'){ var next=(S.tripData.places||[]).filter(function(p){return p.id!==id;}); await saveTripData(Object.assign({},S.tripData,{places:next})); return; }
  if (act==='places-toggle-open'){
    S.ui.places.openId=S.ui.places.openId===id?null:id; render();
    if (S.ui.places.openId===id){
      var pe=(S.tripData.places||[]).find(function(p){return p.id===id;});
      if (pe && pe.photoCount && !photoCache[id]){ await loadPhotosFor(id); render(); }
    }
    return;
  }
  if (act==='places-toggle-visited'){
    var items=(S.tripData.places||[]).map(function(p){ return p.id===id?Object.assign({},p,{visited:!p.visited}):p; });
    await saveTripData(Object.assign({},S.tripData,{places:items})); return;
  }
  if (act==='places-add-rec'){
    var rec = TOKYO_RECS.find(function(r){return r.name===el.dataset.name;}); if (!rec) return;
    if (!S.settings.categories.some(function(c){return c.key===rec.category;})){
      var libCat = FULL_CATEGORY_LIBRARY.find(function(c){return c.key===rec.category;});
      S.settings.categories = S.settings.categories.concat([libCat || { key:rec.category, color:'#B8B8BC', icon:'📍' }]);
      await saveSettings();
    }
    var entry={ id:uid(), name:rec.name, category:rec.category, area:rec.area, note:rec.note, rating:null, hearts:0, visited:false };
    var next=[entry].concat(S.tripData.places||[]);
    await saveTripData(Object.assign({},S.tripData,{places:next})); return;
  }
  if (act==='gmaps'){ window.open(gmapsSearch(el.dataset.name), '_blank'); return; }
  if (act==='navermap'){ window.open(navermapSearch(el.dataset.name), '_blank'); return; }
  if (act==='gmaps-dir'){ window.open(gmapsDirections(el.dataset.origin, el.dataset.dest), '_blank'); return; }
  if (act==='klook-search'){ window.open(platformSearch('klook', el.dataset.name), '_blank'); return; }
  if (act==='kkday-search'){ window.open(platformSearch('kkday', el.dataset.name), '_blank'); return; }
  if (act==='places-price-open'){ S.ui.places.showModal=false; S.ui.places.showAreaManage=false; S.ui.places.priceModalFor=id; render(); return; }
  if (act==='places-price-save'){
    var amount=parseFloat(document.getElementById('pr-amount').value); if (isNaN(amount)) return;
    var platform=document.getElementById('pr-platform').value, currency=document.getElementById('pr-currency').value.trim()||'KRW', date=document.getElementById('pr-date').value;
    var list=S.tripData.places||[];
    var next=list.map(function(p){
      if (p.id!==id) return p;
      var prices=(p.prices||[]).concat([{ id:uid(), platform:platform, amount:amount, currency:currency, checkedDate:date }]);
      return Object.assign({},p,{prices:prices});
    });
    S.ui.places.priceModalFor=null;
    await saveTripData(Object.assign({},S.tripData,{places:next})); return;
  }
  if (act==='places-price-delete'){
    var pid=el.dataset.pid;
    var list=S.tripData.places||[];
    var next=list.map(function(p){
      if (p.id!==id) return p;
      return Object.assign({},p,{prices:(p.prices||[]).filter(function(pr){return pr.id!==pid;})});
    });
    await saveTripData(Object.assign({},S.tripData,{places:next})); return;
  }
  if (act==='places-save'){
    var name=document.getElementById('place-name').value.trim(); if (!name) return;
    var category=document.getElementById('place-category').value || categorize(name);
    var area=document.getElementById('place-area').value.trim();
    var ratingVal=document.getElementById('place-rating').value;
    var heartsVal=parseInt(document.getElementById('place-hearts').value,10)||0;
    var reservedVal=document.getElementById('place-reserved').checked;
    var busyVal=document.getElementById('place-busy').checked;
    var note=document.getElementById('place-note').value.trim();
    var list=S.tripData.places||[]; var editId=S.ui.places.editId; var entId=currentFormId||uid();
    var prevVisited = editId ? (list.find(function(p){return p.id===editId;})||{}).visited : false;
    var entry={ id:entId, name:name, category:category, area:area, rating: ratingVal?parseFloat(ratingVal):null, hearts:heartsVal, reserved:reservedVal, busy:busyVal, note:note, visited: prevVisited||false, photoCount: pendingPhotos.length };
    var next = editId ? list.map(function(p){return p.id===editId?entry:p;}) : [entry].concat(list);
    S.ui.places.showModal=false; S.ui.places.editId=null;
    var trip = currentTrip();
    if (trip && area && (trip.areas||[]).indexOf(area)===-1){
      await saveTrips(S.trips.map(function(t){ return t.id===trip.id ? Object.assign({},t,{areas:(t.areas||[]).concat([area])}) : t; }));
    }
    await savePhotosFor(entId, pendingPhotos);
    pendingPhotos=[]; currentFormId=null;
    await saveTripData(Object.assign({},S.tripData,{places:next})); return;
  }

  /* itinerary */
  if (act==='day-set'){ S.ui.itinerary.activeDay=parseInt(el.dataset.idx,10); render(); return; }
  if (act==='day-add'){
    var days=S.tripData.itinerary||[]; var next=days.concat([{ id:uid(), label:'Day '+(days.length+1), items:[] }]);
    S.ui.itinerary.activeDay=next.length-1;
    await saveTripData(Object.assign({},S.tripData,{itinerary:next})); return;
  }
  if (act==='day-remove'){
    var idx=parseInt(el.dataset.idx,10); var days=S.tripData.itinerary||[]; var next=days.filter(function(_,i){return i!==idx;});
    S.ui.itinerary.activeDay=Math.max(0,idx-1);
    await saveTripData(Object.assign({},S.tripData,{itinerary:next})); return;
  }
  if (act==='item-add-open'){ await openEntityForm('item', null, 0); S.ui.itinerary.editId=null; S.ui.itinerary.transitEditId=null; S.ui.itinerary.showModal=true; render(); return; }
  if (act==='item-edit'){
    var days0=S.tripData.itinerary||[]; var iEntity=days0[S.ui.itinerary.activeDay].items.find(function(i){return i.id===id;});
    await openEntityForm('item', id, iEntity && iEntity.photoCount);
    S.ui.itinerary.editId=id; S.ui.itinerary.transitEditId=null; S.ui.itinerary.showModal=true; render(); return;
  }
  if (act==='transit-edit-open'){ S.ui.itinerary.showModal=false; S.ui.itinerary.transitEditId=id; render(); return; }
  if (act==='transit-save'){
    var mode=document.getElementById('tr-mode').value;
    var duration=parseInt(document.getElementById('tr-duration').value,10)||0;
    var costMode=document.getElementById('tr-costmode').value;
    var transitObj = { mode:mode, duration:duration, costMode:costMode };
    if (costMode==='krw'){ transitObj.cost = parseFloat(document.getElementById('tr-cost-krw').value)||0; }
    else { transitObj.cost = parseFloat(document.getElementById('tr-cost-local').value)||0; transitObj.currency = document.getElementById('tr-currency').value; }
    var days2=S.tripData.itinerary||[]; var di=S.ui.itinerary.activeDay;
    var items2=days2[di].items.map(function(i){ return i.id===S.ui.itinerary.transitEditId ? Object.assign({},i,{transit:transitObj}) : i; });
    var next2=days2.map(function(d,i){ return i===di ? Object.assign({},d,{items:items2}) : d; });
    S.ui.itinerary.transitEditId=null;
    await saveTripData(Object.assign({},S.tripData,{itinerary:next2})); return;
  }
  if (act==='transit-clear'){
    var days3=S.tripData.itinerary||[]; var di3=S.ui.itinerary.activeDay;
    var items3=days3[di3].items.map(function(i){ if (i.id!==S.ui.itinerary.transitEditId) return i; var c=Object.assign({},i); delete c.transit; return c; });
    var next3=days3.map(function(d,i){ return i===di3 ? Object.assign({},d,{items:items3}) : d; });
    S.ui.itinerary.transitEditId=null;
    await saveTripData(Object.assign({},S.tripData,{itinerary:next3})); return;
  }
  if (act==='item-toggle-open'){
    S.ui.itinerary.openId=S.ui.itinerary.openId===id?null:id; render();
    if (S.ui.itinerary.openId===id){
      var days1=S.tripData.itinerary||[]; var ie=days1[S.ui.itinerary.activeDay].items.find(function(i){return i.id===id;});
      if (ie && ie.photoCount && !photoCache[id]){ await loadPhotosFor(id); render(); }
    }
    return;
  }
  if (act==='item-delete'){
    var days=S.tripData.itinerary||[]; var idx=S.ui.itinerary.activeDay;
    var items=days[idx].items.filter(function(i){return i.id!==id;});
    var next=days.map(function(d,i){return i===idx?Object.assign({},d,{items:items}):d;});
    await saveTripData(Object.assign({},S.tripData,{itinerary:next})); return;
  }
  if (act==='item-save'){
    var time=document.getElementById('item-time').value, title=document.getElementById('item-title').value.trim();
    if (!title) return;
    var note=document.getElementById('item-note').value.trim();
    var days=S.tripData.itinerary||[]; var idx=S.ui.itinerary.activeDay; var editId=S.ui.itinerary.editId; var entId=currentFormId||uid();
    var entry={ id:entId, time:time, title:title, note:note, photoCount: pendingPhotos.length };
    var items = editId ? days[idx].items.map(function(i){return i.id===editId?entry:i;}) : days[idx].items.concat([entry]);
    items.sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    var next=days.map(function(d,i){return i===idx?Object.assign({},d,{items:items}):d;});
    S.ui.itinerary.showModal=false; S.ui.itinerary.editId=null;
    await savePhotosFor(entId, pendingPhotos);
    pendingPhotos=[]; currentFormId=null;
    await saveTripData(Object.assign({},S.tripData,{itinerary:next})); return;
  }

  /* archive */
  if (act==='archive-add-open'){ await openEntityForm('archive', null, 0); S.ui.archive.editId=null; S.ui.archive.showModal=true; render(); return; }
  if (act==='archive-edit'){
    var aEntity=(S.tripData.archive||[]).find(function(i){return i.id===id;});
    await openEntityForm('archive', id, aEntity && aEntity.photoCount);
    S.ui.archive.editId=id; S.ui.archive.showModal=true; render(); return;
  }
  if (act==='archive-toggle-open'){
    S.ui.archive.openId=S.ui.archive.openId===id?null:id; render();
    if (S.ui.archive.openId===id){
      var ae=(S.tripData.archive||[]).find(function(i){return i.id===id;});
      if (ae && ae.photoCount && !photoCache[id]){ await loadPhotosFor(id); render(); }
    }
    return;
  }
  if (act==='archive-delete'){ var next=(S.tripData.archive||[]).filter(function(i){return i.id!==id;}); await saveTripData(Object.assign({},S.tripData,{archive:next})); return; }
  if (act==='archive-save'){
    var title=document.getElementById('a-title').value.trim(); if (!title) return;
    var type=document.getElementById('a-type').value, provider=document.getElementById('a-provider').value.trim();
    var date=document.getElementById('a-date').value, time=document.getElementById('a-time').value;
    var code=document.getElementById('a-code').value.trim(), seat=document.getElementById('a-seat').value.trim();
    var note=document.getElementById('a-note').value.trim();
    var list=S.tripData.archive||[]; var editId=S.ui.archive.editId; var entId=currentFormId||uid();
    var entry={ id:entId, type:type, title:title, provider:provider, date:date, time:time, code:code, seat:seat, note:note, photoCount: pendingPhotos.length };
    var next = editId ? list.map(function(i){return i.id===editId?entry:i;}) : [entry].concat(list);
    S.ui.archive.showModal=false; S.ui.archive.editId=null;
    await savePhotosFor(entId, pendingPhotos);
    pendingPhotos=[]; currentFormId=null;
    await saveTripData(Object.assign({},S.tripData,{archive:next})); return;
  }
});

function closeAllModals(){
  S.ui.showNewTrip=false; S.ui.showRateEdit=false;
  S.ui.budget.showModal=false; S.ui.budget.editId=null; S.ui.budget.showSettings=false;
  S.ui.places.showModal=false; S.ui.places.editId=null;
  S.ui.places.priceModalFor=null; S.ui.places.showAreaManage=false;
  S.ui.itinerary.showModal=false; S.ui.itinerary.editId=null; S.ui.itinerary.transitEditId=null;
  S.ui.archive.showModal=false; S.ui.archive.editId=null;
}

/* change listeners (select + checkbox that must not trigger a full re-render mid-typing) */
document.getElementById('root').addEventListener('change', function(e){
  if (e.target.id==='places-visited-select'){ S.ui.places.filterVisited=e.target.value; render(); return; }
  if (e.target.id==='b-custom-rate'){ var wrap=document.getElementById('b-rate-wrap'); wrap.style.display = e.target.checked ? 'block' : 'none'; return; }
  if (e.target.id==='b-currency'){
    var rateField=document.getElementById('b-rate'); var trip=currentTrip();
    if (rateField && trip){ rateField.value = e.target.value===trip.currency ? trip.rate : ''; }
    return;
  }
});
document.getElementById('root').addEventListener('change', function(e){
  if (e.target.classList && e.target.classList.contains('photo-input')){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    resizeImageFile(file).then(function(dataUrl){
      pendingPhotos.push({ id: uid(), dataUrl: dataUrl });
      var c = document.getElementById('photo-thumbs');
      if (c) c.innerHTML = photoThumbsHtml();
    }).catch(function(){});
    e.target.value = '';
  }
});
/* live category auto-detect while typing a place name, without wiping other fields */
document.getElementById('root').addEventListener('input', function(e){
  if (e.target.id==='place-name'){
    var sel=document.getElementById('place-category');
    if (sel && !sel.dataset.touched) sel.value = categorize(e.target.value);
  }
});
document.getElementById('root').addEventListener('change', function(e){
  if (e.target.id==='place-category'){ e.target.dataset.touched='1'; }
});

/* ---------------- boot ---------------- */
loadTrips();
</script>
</body>
</html>
